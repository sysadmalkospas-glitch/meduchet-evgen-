// ====== ОСНОВНОЕ ПРИЛОЖЕНИЕ ======
function App() {
  const [page, setPage] = useState('dashboard');
  const [employees, setEmployees] = useState(initialEmployees);
  const [nomenclature, setNomenclature] = useState(initialNomenclature);
  const [expenses] = useState(initialExpenses);
  const [returns, setReturns] = useState(initialReturns);
  const [messages, setMessages] = useState(initialMessages);
  const [log, setLog] = useState(initialLog);
  const [notifications] = useState(initialNotifications);
  const [remnants] = useState(initialRemnants);
  
  // Google Sheets настройки
  const [sheetsUrl, setSheetsUrl] = useState(localStorage.getItem('sheetsUrl') || '');
  const [isConnected, setIsConnected] = useState(false);
  const [isSyncing, setIsSyncing] = useState(false);
  const [syncStatus, setSyncStatus] = useState('');
  
  useEffect(() => {
    if (sheetsUrl) {
      initSheetsAPI(sheetsUrl);
      testConnection();
    }
  }, [sheetsUrl]);
  
  useEffect(() => {
    if (isConnected && sheetsAPI) {
      syncInterval = setInterval(() => syncData(), 30000);
      return () => clearInterval(syncInterval);
    }
  }, [isConnected]);
  
  async function testConnection() {
    if (!sheetsAPI) return;
    setIsSyncing(true);
    setSyncStatus('Проверка подключения...');
    const connected = await sheetsAPI.testConnection();
    setIsConnected(connected);
    setSyncStatus(connected ? '✅ Подключено к Google Sheets' : '❌ Ошибка подключения');
    setIsSyncing(false);
    if (connected) {
      setSyncStatus('✅ Загрузка данных...');
      const data = await loadFromSheets();
      if (data) setSyncStatus('✅ Данные синхронизированы');
    }
  }
  
  async function syncData() {
    if (!sheetsAPI || !isConnected) return;
    setIsSyncing(true);
    setSyncStatus('⚡ Синхронизация...');
    await sheetsAPI.syncQueue();
    setSyncStatus('✅ Синхронизировано');
    setIsSyncing(false);
    setTimeout(() => setSyncStatus(''), 2000);
  }
  
  function saveSheetsUrl(url) {
    localStorage.setItem('sheetsUrl', url);
    setSheetsUrl(url);
    if (url) {
      initSheetsAPI(url);
      testConnection();
    } else {
      sheetsAPI = null;
      setIsConnected(false);
    }
  }

  const addLog = (action, objectType, oldValue, newValue) => {
    const entry = { id:'l'+Date.now(), timestamp: new Date().toLocaleString('ru-RU'), userName:'Руководитель', role:'Руководитель', action, objectType, oldValue, newValue };
    setLog(prev => [entry, ...prev]);
    if (sheetsAPI && isConnected) sheetsAPI.write('Журнал', entry);
  };

  const navItems = [
    { id:'dashboard', label:'Панель', icon: navIcons.dashboard },
    { id:'employees', label:'Сотрудники', icon: navIcons.users },
    { id:'nomenclature', label:'Номенклатура', icon: navIcons.package },
    { id:'income', label:'Приход', icon: navIcons.dollar },
    { id:'remnants', label:'Остатки', icon: navIcons.archive },
    { id:'expenses', label:'Расход', icon: navIcons.arrows },
    { id:'returns', label:'Возвраты', icon: navIcons.arrows },
    { id:'chat', label:'Чат', icon: navIcons.chat },
    { id:'reports', label:'Отчёты', icon: navIcons.file },
    { id:'log', label:'Журнал', icon: navIcons.scroll },
    { id:'settings', label:'Настройки', icon: navIcons.settings },
  ];

  const unreadNotifs = notifications.filter(n => !n.read).length;
  const unreadMsgs = messages.filter(m => !m.read && m.to === 'manager').length;
  const queueSize = sheetsAPI ? sheetsAPI.getQueueSize() : 0;

  return (
    <div className="app">
      <aside className="sidebar">
        <div className="sidebar-header">
          <div className="sidebar-logo">
            <div className="sidebar-logo-icon">💊</div>
            <div className="sidebar-logo-text">
              <h1>МедУчёт</h1>
              <p>Выездное подразделение</p>
            </div>
          </div>
        </div>
        <nav className="sidebar-nav">
          {navItems.map(item => {
            const isActive = page === item.id;
            const badge = item.id === 'chat' ? unreadMsgs : item.id === 'dashboard' ? unreadNotifs : 0;
            return (
              <button key={item.id} className={`nav-btn ${isActive ? 'active' : ''}`} onClick={() => setPage(item.id)}>
                <SvgIcon path={item.icon} />
                <span className="nav-label">{item.label}</span>
                {badge > 0 && <span className="nav-badge">{badge}</span>}
              </button>
            );
          })}
        </nav>
        <div className="sidebar-footer">
          {isConnected && (
            <div style={{marginBottom:12,padding:'6px 10px',borderRadius:6,background:queueSize>0?'#fef9c3':'#dcfce7',fontSize:11,fontWeight:500,color:queueSize>0?'#a16207':'#15803d',display:'flex',alignItems:'center',gap:6}}>
              <SvgIcon path={navIcons.cloud} size={12} />
              {queueSize > 0 ? `Ожидает: ${queueSize}` : 'Google Sheets'}
            </div>
          )}
          <div className="user-info">
            <div className="user-avatar">РВ</div>
            <div>
              <div className="user-name">Руководитель</div>
              <div className="user-role">Выездное подразделение</div>
            </div>
          </div>
        </div>
      </aside>

      <main className="main">
        <header className="header">
          <div>
            <h2>{navItems.find(n => n.id === page)?.label}</h2>
            <p>Март 2024 {isConnected && <span style={{color:'#15803d',fontSize:11}}>• Google Sheets</span>}</p>
          </div>
          <div className="header-right">
            {syncStatus && <span style={{fontSize:11,color:'#6b7280'}}>{syncStatus}</span>}
            <button className="bell-btn" onClick={() => setPage('dashboard')}>
              <SvgIcon path={navIcons.bell} size={20} />
              {unreadNotifs > 0 && <span className="bell-badge">{unreadNotifs}</span>}
            </button>
            <div className="header-divider"></div>
            <div className="header-user">
              <div className="header-user-name">Сидоров А.В.</div>
              <div className="header-user-role">Руководитель</div>
            </div>
          </div>
        </header>

        <div className="content">
          {page === 'dashboard' && <Dashboard employees={employees} expenses={expenses} notifications={notifications} nomenclature={nomenclature} returns={returns} remnants={remnants} />}
          {page === 'employees' && <Employees employees={employees} setEmployees={setEmployees} addLog={addLog} sheetsAPI={sheetsAPI} isConnected={isConnected} />}
          {page === 'nomenclature' && <NomenclaturePage nomenclature={nomenclature} setNomenclature={setNomenclature} addLog={addLog} sheetsAPI={sheetsAPI} isConnected={isConnected} />}
          {page === 'income' && <IncomePage employees={employees} setEmployees={setEmployees} addLog={addLog} sheetsAPI={sheetsAPI} isConnected={isConnected} />}
          {page === 'remnants' && <RemnantsPage employees={employees} nomenclature={nomenclature} remnants={remnants} />}
          {page === 'expenses' && <ExpensesPage expenses={expenses} employees={employees} nomenclature={nomenclature} />}
          {page === 'returns' && <ReturnsPage returns={returns} setReturns={setReturns} employees={employees} nomenclature={nomenclature} addLog={addLog} sheetsAPI={sheetsAPI} isConnected={isConnected} />}
          {page === 'chat' && <ChatPage messages={messages} setMessages={setMessages} employees={employees} sheetsAPI={sheetsAPI} isConnected={isConnected} />}
          {page === 'reports' && <ReportsPage employees={employees} expenses={expenses} nomenclature={nomenclature} remnants={remnants} />}
          {page === 'log' && <LogPage log={log} />}
          {page === 'settings' && <SettingsPage sheetsUrl={sheetsUrl} isConnected={isConnected} isSyncing={isSyncing} syncStatus={syncStatus} saveSheetsUrl={saveSheetsUrl} testConnection={testConnection} syncData={syncData} queueSize={queueSize} />}
        </div>
      </main>
    </div>
  );
}

// ====== ПАНЕЛЬ ======
function Dashboard({ employees, expenses, notifications, nomenclature, returns, remnants }) {
  const active = employees.filter(e => e.status === 'active');
  const totalIncome = employees.reduce((s, e) => s + e.income, 0);
  const totalExpense = expenses.reduce((s, e) => s + e.totalSum, 0);
  const totalRemnant = remnants.reduce((s, r) => s + r.sumRub, 0);
  const unread = notifications.filter(n => !n.read);

  const empData = employees.map(emp => {
    const empExp = expenses.filter(e => e.employeeId === emp.id);
    const totalExp = empExp.reduce((s, e) => s + e.totalSum, 0);
    const patients = new Set(empExp.map(e => e.patientName)).size;
    return { ...emp, totalExp, patients, diff: emp.income - totalExp };
  });

  return (
    <div>
      <div className="kpi-grid">
        <div className="kpi-card"><div className="kpi-label">Общий приход</div><div className="kpi-value" style={{color:'#16a34a'}}>{fmt(totalIncome)} ₽</div></div>
        <div className="kpi-card"><div className="kpi-label">Общий расход</div><div className="kpi-value" style={{color:'#dc2626'}}>{fmt(totalExpense)} ₽</div></div>
        <div className="kpi-card"><div className="kpi-label">Остаток подразд.</div><div className="kpi-value" style={{color:'#2563eb'}}>{fmt(totalRemnant)} ₽</div></div>
        <div className="kpi-card"><div className="kpi-label">Сотрудники</div><div className="kpi-value">{active.length} / {employees.length}</div></div>
      </div>

      {unread.length > 0 && unread.map(n => (
        <div key={n.id} className={`alert alert-${n.type==='overexpense'?'red':n.type==='inactivity'?'yellow':n.type==='return'?'orange':'blue'}`}>
          <SvgIcon path={navIcons.alert} size={18} />
          <div><div style={{fontSize:13,fontWeight:600}}>{n.title}</div><div style={{fontSize:12,color:'#6b7280'}}>{n.text}</div></div>
        </div>
      ))}

      <div className="card">
        <div className="card-header"><h3>Сотрудники — обзор за март</h3><p>Приход, расход, разница и количество пациентов</p></div>
        <div style={{overflowX:'auto'}}>
          <table className="data">
            <thead><tr><th>Сотрудник</th><th>Статус</th><th className="text-right">Приход (₽)</th><th className="text-right">Расход (₽)</th><th className="text-right">Разница (₽)</th><th className="text-center">Пациентов</th><th className="text-center">Смен</th></tr></thead>
            <tbody>
              {empData.map(emp => (
                <tr key={emp.id}>
                  <td><div className="emp-cell"><div className="avatar">{getInitials(emp.fullName)}</div><div><div className="emp-name">{emp.fullName}</div><div className="emp-num">№{emp.personalNumber}</div></div></div></td>
                  <td><span className={`badge ${emp.status==='active'?'badge-green':emp.status==='vacation'?'badge-yellow':emp.status==='blocked'?'badge-red':'badge-gray'}`}>{emp.status==='active'?'Активен':emp.status==='vacation'?'Отпуск':emp.status==='blocked'?'Заблокирован':'Неактивен'}</span></td>
                  <td className="text-right font-medium text-green">{fmt(emp.income)} ₽</td>
                  <td className="text-right font-medium text-red">{fmt(emp.totalExp)} ₽</td>
                  <td className={`text-right font-bold ${emp.diff>=0?'text-green':'text-red'}`}>{emp.diff>=0?'+':''}{fmt(emp.diff)} ₽</td>
                  <td className="text-center font-medium">{emp.patients}</td>
                  <td className="text-center">{emp.shifts}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ====== СОТРУДНИКИ ======
function Employees({ employees, setEmployees, addLog, sheetsAPI, isConnected }) {
  const [search, setSearch] = useState('');
  const [filter, setFilter] = useState('all');
  const [showAdd, setShowAdd] = useState(false);
  const [newName, setNewName] = useState('');
  const [newNum, setNewNum] = useState('');

  const filtered = employees.filter(e => {
    const ms = e.fullName.toLowerCase().includes(search.toLowerCase()) || e.personalNumber.includes(search);
    const mf = filter === 'all' || e.status === filter;
    return ms && mf;
  });

  const statusLabel = { active:'Активен', inactive:'Неактивен', vacation:'Отпуск', blocked:'Заблокирован' };

  return (
    <div>
      <div className="toolbar">
        <div className="toolbar-left">
          <input className="input" style={{width:220}} value={search} onChange={e=>setSearch(e.target.value)} placeholder="Поиск..." />
          <select className="select" value={filter} onChange={e=>setFilter(e.target.value)}>
            <option value="all">Все статусы</option>
            <option value="active">Активные</option>
            <option value="vacation">В отпуске</option>
            <option value="blocked">Заблокированные</option>
            <option value="inactive">Неактивные</option>
          </select>
        </div>
        <button className="btn btn-primary" onClick={()=>setShowAdd(true)}><SvgIcon path={navIcons.plus} size={16} /> Добавить</button>
      </div>

      {showAdd && (
        <div className="modal-overlay" onClick={()=>setShowAdd(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h3>Новый сотрудник</h3>
            <div className="form-group"><label>ФИО *</label><input className="input" value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Иванов Иван Иванович" /></div>
            <div className="form-group"><label>Персональный номер *</label><input className="input" value={newNum} onChange={e=>setNewNum(e.target.value)} placeholder="1011" /></div>
            <div className="modal-actions">
              <button className="btn btn-outline" onClick={()=>setShowAdd(false)}>Отмена</button>
              <button className="btn btn-primary" onClick={()=>{
                if(!newName||!newNum) return;
                const emp = { id:'emp'+Date.now(), fullName:newName, personalNumber:newNum, status:'active', hireDate:new Date().toISOString().split('T')[0], shifts:0, income:0, lastExpenseDate:null, blocked:false };
                setEmployees([...employees, emp]);
                addLog('Добавление сотрудника','Сотрудник '+emp.id,'—',emp.fullName);
                if (sheetsAPI && isConnected) sheetsAPI.write('Сотрудники', emp);
                setShowAdd(false); setNewName(''); setNewNum('');
              }}>Добавить</button>
            </div>
          </div>
        </div>
      )}

      <div className="card">
        <table className="data">
          <thead><tr><th>Сотрудник</th><th>№</th><th>Статус</th><th>Дата найма</th><th>Смен</th><th>Действия</th></tr></thead>
          <tbody>
            {filtered.map(emp => (
              <tr key={emp.id}>
                <td className="font-medium">{emp.fullName}</td>
                <td style={{fontFamily:'monospace',fontSize:12,color:'#6b7280'}}>{emp.personalNumber}</td>
                <td><span className={`badge ${emp.status==='active'?'badge-green':emp.status==='vacation'?'badge-yellow':emp.status==='blocked'?'badge-red':'badge-gray'}`}>{statusLabel[emp.status]}</span></td>
                <td style={{fontSize:12,color:'#6b7280'}}>{emp.hireDate}</td>
                <td>{emp.shifts}</td>
                <td>
                  <div style={{display:'flex',gap:4}}>
                    {emp.status !== 'blocked' ? (
                      <button className="btn-icon" title="Заблокировать" onClick={()=>{
                        setEmployees(employees.map(e=>e.id===emp.id?{...e,status:'blocked',blocked:true}:e));
                        addLog('Блокировка','Сотрудник '+emp.id,emp.status,'blocked');
                        if (sheetsAPI && isConnected) sheetsAPI.update('Сотрудники', emp.id, {status:'blocked',blocked:true});
                      }}><SvgIcon path={navIcons.lock} size={14} /></button>
                    ) : (
                      <button className="btn-icon" title="Разблокировать" onClick={()=>{
                        setEmployees(employees.map(e=>e.id===emp.id?{...e,status:'active',blocked:false}:e));
                        addLog('Разблокировка','Сотрудник '+emp.id,'blocked','active');
                        if (sheetsAPI && isConnected) sheetsAPI.update('Сотрудники', emp.id, {status:'active',blocked:false});
                      }}><SvgIcon path={navIcons.unlock} size={14} /></button>
                    )}
                    <button className="btn-icon" title="Удалить" onClick={()=>{if(confirm('Удалить '+emp.fullName+'?')){
                      setEmployees(employees.filter(e=>e.id!==emp.id));
                      if (sheetsAPI && isConnected) sheetsAPI.delete('Сотрудники', emp.id);
                    }}}><SvgIcon path={navIcons.trash} size={14} /></button>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

      </div>

      {view === 'emp' && employees.filter(e=>e.status!=='blocked').map(emp => {
        const empRem = remnants.filter(r => r.employeeId === emp.id);
        if (empRem.length === 0) return null;
        const empTotal = empRem.reduce((s, r) => s + r.sumRub, 0);
        return (
          <div key={emp.id} className="emp-card">
            <div className="emp-card-header">
              <div className="emp-cell"><div className="avatar">{getInitials(emp.fullName)}</div><div><div className="emp-name" style={{fontSize:13}}>{emp.fullName}</div><div className="emp-num">№{emp.personalNumber}</div></div></div>
              <div style={{textAlign:'right'}}><div className="emp-card-total">{fmt(empTotal)} ₽</div><div className="emp-card-sub">общий остаток</div></div>
            </div>
            <table className="data" style={{fontSize:12}}>
              <thead><tr style={{background:'#fafafa'}}><th style={{padding:'8px 16px',fontSize:11,color:'#6b7280',fontWeight:500}}>Наименование</th><th style={{padding:'8px 16px',fontSize:11,color:'#6b7280',fontWeight:500,textAlign:'right'}}>Ед.</th><th style={{padding:'8px 16px',fontSize:11,color:'#6b7280',fontWeight:500,textAlign:'right'}}>Кол-во</th><th style={{padding:'8px 16px',fontSize:11,color:'#6b7280',fontWeight:500,textAlign:'right'}}>Цена</th><th style={{padding:'8px 16px',fontSize:11,color:'#6b7280',fontWeight:500,textAlign:'right'}}>Сумма</th></tr></thead>
              <tbody>
                {empRem.map(r => {
                  const nom = nomenclature.find(n => n.id === r.nomenclatureId);
                  return <tr key={r.nomenclatureId}><td style={{padding:'8px 16px',fontWeight:500}}>{nom?.name}</td><td style={{padding:'8px 16px',textAlign:'right',color:'#6b7280'}}>{nom?.unit}</td><td style={{padding:'8px 16px',textAlign:'right',fontWeight:500}}>{r.quantity}</td><td style={{padding:'8px 16px',textAlign:'right',color:'#6b7280'}}>{nom?.price} ₽</td><td style={{padding:'8px 16px',textAlign:'right',fontWeight:500}}>{fmt(r.sumRub)} ₽</td></tr>;
                })}
              </tbody>
            </table>
          </div>
        );
      })}

      {view === 'nom' && (
        <div className="card">
          <table className="data">
            <thead><tr><th>Номенклатура</th><th>Ед. изм.</th><th className="text-right">Остаток (шт)</th><th className="text-right">Цена</th><th className="text-right">Сумма (₽)</th></tr></thead>
            <tbody>
              {nomenclature.map(nom => {
                const items = remnants.filter(r => r.nomenclatureId === nom.id);
                const totalQ = items.reduce((s, i) => s + i.quantity, 0);
                const totalS = items.reduce((s, i) => s + i.sumRub, 0);
                if (totalQ === 0) return null;
                return <tr key={nom.id}><td className="font-medium">{nom.name}</td><td style={{color:'#6b7280'}}>{nom.unit}</td><td className="text-right font-medium">{totalQ}</td><td className="text-right" style={{color:'#6b7280'}}>{nom.price} ₽</td><td className="text-right font-bold text-blue">{fmt(totalS)} ₽</td></tr>;
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ====== РАСХОД ======
function ExpensesPage({ expenses, employees, nomenclature }) {
  const [search, setSearch] = useState('');
  const filtered = expenses.filter(e => {
    if (!search) return true;
    const emp = employees.find(em => em.id === e.employeeId);
    const nom = nomenclature.find(n => n.id === e.nomenclatureId);
    return e.patientName.toLowerCase().includes(search.toLowerCase()) || emp?.fullName.toLowerCase().includes(search.toLowerCase()) || nom?.name.toLowerCase().includes(search.toLowerCase());
  });

  return (
    <div>
      <div className="kpi-grid" style={{gridTemplateColumns:'repeat(3,1fr)',marginBottom:24}}>
        <div className="kpi-card"><div className="kpi-label">Записей расхода</div><div className="kpi-value">{filtered.length}</div></div>
        <div className="kpi-card"><div className="kpi-label">Общая сумма</div><div className="kpi-value text-red">{fmt(filtered.reduce((s,e)=>s+e.totalSum,0))} ₽</div></div>
        <div className="kpi-card"><div className="kpi-label">Пациентов</div><div className="kpi-value text-blue">{new Set(filtered.map(e=>e.patientName)).size}</div></div>
      </div>

      <input className="input" style={{marginBottom:16}} value={search} onChange={e=>setSearch(e.target.value)} placeholder="Поиск по пациенту, сотруднику, препарату..." />

      <div className="card">
        <div style={{overflowX:'auto'}}>
          <table className="data">
            <thead><tr><th>Дата</th><th>Сотрудник</th><th>Пациент</th><th>Дата рожд.</th><th>Препарат</th><th className="text-center">Кол-во</th><th className="text-right">Цена</th><th className="text-right">Сумма</th></tr></thead>
            <tbody>
              {[...filtered].sort((a,b)=>b.date.localeCompare(a.date)).map(exp => {
                const emp = employees.find(e=>e.id===exp.employeeId);
                const nom = nomenclature.find(n=>n.id===exp.nomenclatureId);
                return <tr key={exp.id}><td style={{fontSize:12,color:'#6b7280'}}>{exp.date}</td><td style={{fontSize:12,fontWeight:500}}>{emp?.fullName||'—'}</td><td style={{fontSize:12}}>{exp.patientName}</td><td style={{fontSize:12,color:'#6b7280'}}>{exp.patientDob}</td><td style={{fontSize:12}}><span style={{fontWeight:500}}>{nom?.name}</span> <span style={{color:'#9ca3af',fontSize:10}}>({nom?.unit})</span></td><td className="text-center font-medium">{exp.quantity}</td><td className="text-right" style={{fontSize:12,color:'#6b7280'}}>{exp.priceAtMoment}</td><td className="text-right font-bold text-red">{exp.totalSum} ₽</td></tr>;
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ====== ВОЗВРАТЫ ======
function ReturnsPage({ returns, setReturns, employees, nomenclature, addLog, sheetsAPI, isConnected }) {
  const statusLabels = { pending:'Ожидает', approved:'Подтверждён', adjusted:'Скорректирован' };
  const statusColors = { pending:'badge-yellow', approved:'badge-green', adjusted:'badge-blue' };

  return (
    <div>
      <div className="kpi-grid" style={{gridTemplateColumns:'repeat(3,1fr)',marginBottom:24}}>
        <div className="kpi-card"><div className="kpi-label">Всего возвратов</div><div className="kpi-value">{returns.length}</div></div>
        <div className="kpi-card" style={{background:'#fefce8',borderColor:'#fef08a'}}><div className="kpi-label" style={{color:'#a16207'}}>Ожидают</div><div className="kpi-value" style={{color:'#854d0e'}}>{returns.filter(r=>r.status==='pending').length}</div></div>
        <div className="kpi-card" style={{background:'#f0fdf4',borderColor:'#bbf7d0'}}><div className="kpi-label" style={{color:'#15803d'}}>Подтверждено</div><div className="kpi-value" style={{color:'#14532d'}}>{returns.filter(r=>r.status==='approved').length}</div></div>
      </div>

      <div className="card">
        <table className="data">
          <thead><tr><th>Дата</th><th>Сотрудник</th><th>Номенклатура</th><th className="text-center">Кол-во</th><th>Статус</th><th>Подтвердил</th><th>Действия</th></tr></thead>
          <tbody>
            {returns.map(ret => {
              const emp = employees.find(e=>e.id===ret.employeeId);
              const nom = nomenclature.find(n=>n.id===ret.nomenclatureId);
              return (
                <tr key={ret.id} style={ret.status==='pending'?{background:'#fffbeb'}:{}}>
                  <td style={{fontSize:12,color:'#6b7280'}}>{ret.date}</td>
                  <td style={{fontSize:12,fontWeight:500}}>{emp?.fullName||'—'}</td>
                  <td style={{fontSize:12}}><span style={{fontWeight:500}}>{nom?.name}</span> <span style={{color:'#9ca3af',fontSize:10}}>({nom?.unit})</span></td>
                  <td className="text-center font-medium">{ret.quantity}{ret.adjustedQuantity && <span style={{fontSize:10,color:'#2563eb',marginLeft:4}}>(→ {ret.adjustedQuantity})</span>}</td>
                  <td><span className={`badge ${statusColors[ret.status]}`}>{statusLabels[ret.status]}</span></td>
                  <td style={{fontSize:12,color:'#6b7280'}}>{ret.confirmedBy||'—'}</td>
                  <td>
                    {ret.status==='pending' && (
                      <button className="btn btn-sm" style={{background:'#f0fdf4',color:'#15803d',border:'1px solid #bbf7d0'}} onClick={()=>{
                        setReturns(returns.map(r=>r.id===ret.id?{...r,status:'approved',confirmedBy:'Руководитель'}:r));
                        addLog('Подтверждение возврата','Возврат '+ret.id,'pending','approved');
                        if (sheetsAPI && isConnected) sheetsAPI.update('Возвраты', ret.id, {status:'approved',confirmedBy:'Руководитель'});
                      }}>
                        <SvgIcon path={navIcons.check} size={12} /> Подтвердить
                      </button>
                    )}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ====== ЧАТ ======
function ChatPage({ messages, setMessages, employees, sheetsAPI, isConnected }) {
  const [selected, setSelected] = useState(null);
  const [newMsg, setNewMsg] = useState('');

  const conversations = employees.filter(e=>e.status!=='blocked').map(emp => {
    const msgs = messages.filter(m => (m.from===emp.id && m.to==='manager') || (m.from==='manager' && m.to===emp.id)).sort((a,b)=>a.date.localeCompare(b.date));
    const unread = msgs.filter(m => !m.read && m.to==='manager').length;
    return { employee:emp, messages:msgs, unread, lastMsg:msgs[msgs.length-1] };
  }).filter(c => c.messages.length > 0);

  const current = conversations.find(c => c.employee.id === selected);

  const handleSend = () => {
    if (!newMsg.trim() || !selected) return;
    const msg = { id:'msg'+Date.now(), from:'manager', fromRole:'manager', to:selected, toRole:'employee', text:newMsg.trim(), date:new Date().toLocaleString('ru-RU'), read:false };
    setMessages([...messages, msg]);
    if (sheetsAPI && isConnected) sheetsAPI.write('Сообщения', msg);
    setNewMsg('');
  };

  const handleSelect = (id) => {
    setSelected(id);
    setMessages(messages.map(m => m.from===id && m.to==='manager' ? {...m,read:true} : m));
  };

  return (
    <div className="chat-container">
      <div className="chat-sidebar">
        <div className="chat-sidebar-header">Диалоги</div>
        <div className="chat-list">
          {conversations.map(conv => (
            <button key={conv.employee.id} className={`chat-item ${selected===conv.employee.id?'active':''}`} onClick={()=>handleSelect(conv.employee.id)}>
              <div className="avatar" style={{width:36,height:36,fontSize:10}}>{getInitials(conv.employee.fullName)}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <span style={{fontSize:12,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{conv.employee.fullName}</span>
                  {conv.unread > 0 && <span className="nav-badge" style={{width:16,height:16,fontSize:9}}>{conv.unread}</span>}
                </div>
                {conv.lastMsg && <div style={{fontSize:10,color:'#9ca3af',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',marginTop:2}}>{conv.lastMsg.from==='manager'?'Вы: ':''}{conv.lastMsg.text}</div>}
              </div>
            </button>
          ))}
        </div>
      </div>
      <div className="chat-main">
        {current ? (
          <>
            <div className="chat-header">
              <div className="avatar" style={{width:36,height:36,fontSize:10}}>{getInitials(current.employee.fullName)}</div>
              <div><div style={{fontWeight:600,fontSize:13}}>{current.employee.fullName}</div><div style={{fontSize:10,color:'#9ca3af'}}>№{current.employee.personalNumber}</div></div>
            </div>
            <div className="chat-messages">
              {current.messages.map(msg => (
                <div key={msg.id} style={{display:'flex',justifyContent:msg.from==='manager'?'flex-end':'flex-start'}}>
                  <div className={`msg-bubble ${msg.from==='manager'?'msg-out':'msg-in'}`}>
                    <div>{msg.text}</div>
                    <div className="msg-time">{msg.date}</div>
                  </div>
                </div>
              ))}
            </div>
            <div className="chat-input">
              <input className="input" value={newMsg} onChange={e=>setNewMsg(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleSend()} placeholder="Введите сообщение..." />
              <button className="btn btn-primary" onClick={handleSend}><SvgIcon path={navIcons.send} size={16}/></button>
            </div>
          </>
        ) : (
          <div className="empty-state">Выберите диалог</div>
        )}
      </div>
    </div>
  );
}

// ====== ОТЧЁТЫ ======
function ReportsPage({ employees, expenses, nomenclature, remnants }) {
  const [reportType, setReportType] = useState('monthly');
  const active = employees.filter(e=>e.status!=='blocked');
  const data = active.map(emp => {
    const empExp = expenses.filter(e=>e.employeeId===emp.id);
    const totalExp = empExp.reduce((s,e)=>s+e.totalSum,0);
    const patients = new Set(empExp.map(e=>e.patientName)).size;
    const rem = remnants.filter(r=>r.employeeId===emp.id).reduce((s,r)=>s+r.sumRub,0);
    return { ...emp, calls:empExp.length, patients, expenseRub:totalExp, remnantRub:rem, diff:emp.income-totalExp };
  });
  const totalIncome = data.reduce((s,r)=>s+r.income,0);
  const totalExpense = data.reduce((s,r)=>s+r.expenseRub,0);
  const totalRemnant = data.reduce((s,r)=>s+r.remnantRub,0);

  return (
    <div>
      <div className="toolbar">
        <div className="tab-group" style={{marginBottom:0}}>
          {[{id:'monthly',label:'Месячный'},{id:'employee',label:'По сотрудникам'},{id:'nomenclature',label:'По номенклатуре'}].map(t=>(
            <button key={t.id} className={`tab-btn ${reportType===t.id?'active':''}`} onClick={()=>setReportType(t.id)}>{t.label}</button>
          ))}
        </div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-outline">📄 PDF</button>
          <button className="btn btn-success">📊 Excel</button>
        </div>
      </div>

      <div className="report-summary">
        <h3>Отчёт за Март 2024</h3>
        <div className="report-grid">
          {[{label:'Общий приход',value:fmt(totalIncome)+' ₽',bg:'#f0fdf4',color:'#15803d'},{label:'Общий расход',value:fmt(totalExpense)+' ₽',bg:'#fef2f2',color:'#b91c1c'},{label:'Остаток подразд.',value:fmt(totalRemnant)+' ₽',bg:'#eff6ff',color:'#1d4ed8'},{label:'Всего пациентов',value:new Set(expenses.map(e=>e.patientName)).size.toString(),bg:'#faf5ff',color:'#7c3aed'}].map((c,i)=>(
            <div key={i} className="report-card" style={{background:c.bg}}><div className="label" style={{color:c.color}}>{c.label}</div><div className="value" style={{color:c.color}}>{c.value}</div></div>
          ))}
        </div>
      </div>

      {reportType === 'monthly' && (
        <div className="card">
          <table className="data">
            <thead><tr><th>№</th><th>ФИО</th><th className="text-center">Вызовов</th><th className="text-center">Пациентов</th><th className="text-right">Приход (₽)</th><th className="text-right">Расход (₽)</th><th className="text-right">Остаток (₽)</th></tr></thead>
            <tbody>
              {data.map((row,i) => (
                <tr key={row.id}><td style={{color:'#9ca3af'}}>{i+1}</td><td className="font-medium">{row.fullName}</td><td className="text-center">{row.calls}</td><td className="text-center">{row.patients}</td><td className="text-right font-medium text-green">{fmt(row.income)}</td><td className="text-right font-medium text-red">{fmt(row.expenseRub)}</td><td className={`text-right font-bold ${row.diff>=0?'text-green':'text-red'}`}>{row.diff>=0?'+':''}{fmt(row.diff)}</td></tr>
              ))}
            </tbody>
            <tr style={{background:'#f9fafb',fontWeight:700}}>
              <td style={{padding:'12px 16px'}} colSpan={2}>ИТОГО</td>
              <td className="text-center">{data.reduce((s,r)=>s+r.calls,0)}</td>
              <td className="text-center">{new Set(expenses.map(e=>e.patientName)).size}</td>
              <td className="text-right text-green">{fmt(totalIncome)} ₽</td>
              <td className="text-right text-red">{fmt(totalExpense)} ₽</td>
              <td className="text-right text-blue">{fmt(totalRemnant)} ₽</td>
            </tr>
          </table>
        </div>
      )}

      {reportType === 'nomenclature' && (
        <div className="card">
          <table className="data">
            <thead><tr><th>Номенклатура</th><th>Ед. изм.</th><th className="text-right">Расход (шт)</th><th className="text-right">Сумма (₽)</th><th className="text-center">Пациентов</th></tr></thead>
            <tbody>
              {nomenclature.map(nom => {
                const nomExp = expenses.filter(e=>e.nomenclatureId===nom.id);
                const totalQ = nomExp.reduce((s,e)=>s+e.quantity,0);
                const totalS = nomExp.reduce((s,e)=>s+e.totalSum,0);
                const pts = new Set(nomExp.map(e=>e.patientName)).size;
                if (totalQ===0) return null;
                return <tr key={nom.id}><td className="font-medium">{nom.name}</td><td style={{color:'#6b7280'}}>{nom.unit}</td><td className="text-right font-medium">{totalQ}</td><td className="text-right font-medium text-red">{fmt(totalS)} ₽</td><td className="text-center">{pts}</td></tr>;
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ====== ЖУРНАЛ ======
function LogPage({ log }) {
  const [search, setSearch] = useState('');
  const filtered = log.filter(l => !search || l.userName.toLowerCase().includes(search.toLowerCase()) || l.action.toLowerCase().includes(search.toLowerCase()));

  const actionColors = {
    'Изменение цены':'badge-yellow','Добавление сотрудника':'badge-green','Блокировка':'badge-red','Разблокировка':'badge-green',
    'Начисление прихода':'badge-blue','Подтверждение возврата':'badge-emerald','Отправка сообщения':'badge-indigo'
  };

  return (
    <div>
      <div className="card" style={{padding:16,marginBottom:16}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
          <SvgIcon path={navIcons.scroll} size={20} />
          <div><h3 style={{fontWeight:600,fontSize:15}}>Журнал изменений</h3><p style={{fontSize:12,color:'#9ca3af'}}>Версионность данных: кто, когда, что изменил</p></div>
        </div>
        <input className="input" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Поиск по журналу..." />
      </div>

      <div className="card">
        <table className="data">
          <thead><tr><th>Дата/Время</th><th>Кто</th><th>Роль</th><th>Действие</th><th>Объект</th><th>Было → Стало</th><th>Комментарий</th></tr></thead>
          <tbody>
            {filtered.map(entry => (
              <tr key={entry.id}>
                <td style={{fontSize:12,color:'#6b7280',whiteSpace:'nowrap'}}>{entry.timestamp}</td>
                <td style={{fontSize:12,fontWeight:500}}>{entry.userName}</td>
                <td><span className={`badge ${entry.role==='Руководитель'?'badge-blue':'badge-orange'}`}>{entry.role}</span></td>
                <td><span className={`badge ${actionColors[entry.action]||'badge-gray'}`}>{entry.action}</span></td>
                <td style={{fontSize:12,color:'#4b5563'}}>{entry.objectType}</td>
                <td><div className="log-change"><span className="log-old">{entry.oldValue}</span><span className="log-arrow">→</span><span className="log-new">{entry.newValue}</span></div></td>
                <td style={{fontSize:12,color:'#9ca3af'}}>{entry.comment||'—'}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
